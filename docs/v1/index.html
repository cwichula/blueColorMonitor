<!doctype html>
<!-- lang i dir ustawia shared/i18n.js, zanim parser dojdzie do <body>. Wpisane
     tu "en" to tylko wartość zapasowa na wypadek, gdyby silnik się nie wczytał —
     angielski, bo to on jest językiem zapasowym całej aplikacji. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Warstwa językowa PRZED wszystkim innym. i18n.js dopisuje znaczniki
     słowników do strumienia parsera (document.write), więc musi się wykonać,
     zanim parser dojdzie do jakiegokolwiek skryptu budującego ekran — i zanim
     i18n-dom.js zacznie czytać znaczniki data-i18n. Szczegóły w nagłówku
     docs/shared/i18n.js. -->
<script src="../shared/i18n.js"></script>
<script src="i18n-dom.js"></script>
<title data-i18n="app.name"></title>
<meta name="description" content="" data-i18n-attr="content:app.description">
<meta name="theme-color" content="#1a1a19">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<!-- Musi wczytać się PO style.css: globalne [hidden]{display:none!important}
     i .btn-large mają wygrywać kolejnością źródła, a nie sztuczkami na
     specyficzność selektorów. -->
<link rel="stylesheet" href="ui.css">
</head>
<body class="viz-root">

<header class="app-header">
  <h1 data-i18n="app.name"></h1>
  <div class="header-actions">
    <button id="infoBtn" class="icon-btn" type="button" data-i18n-attr="aria-label:action.openDocs">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><line x1="12" y1="11" x2="12" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="7.5" r="1.2" fill="currentColor"/></svg>
    </button>
  </div>
</header>

<!-- Zostaje w DOM (selectTab dalej należy do app.js), ale menu.js go ukrywa,
     żeby czytnik ekranu nie słyszał tej samej nawigacji dwa razy. -->
<div class="tabs" id="legacyTabs" role="tablist" data-i18n-attr="aria-label:nav.tabsAria">
  <button id="tabCamera" class="tab-btn" type="button" role="tab" aria-selected="true" aria-controls="panelCamera" data-i18n="nav.camera"></button>
  <button id="tabMonitoring" class="tab-btn" type="button" role="tab" aria-selected="false" aria-controls="panelMonitoring" tabindex="-1" data-i18n="nav.monitoring"></button>
</div>

<main>
<!-- role="region", nie "tabpanel": menu.js ukrywa #legacyTabs, więc w drzewie
     dostępności nie zostaje ani role="tablist", ani role="tab", a tabpanel
     byłby tu osierocony. app.js przełącza tylko .hidden i aria-selected,
     więc go to nie dotyczy. -->
<div id="panelCamera" role="region" data-i18n-attr="aria-label:nav.camera">

  <section class="card camera-card" data-i18n-attr="aria-label:camera.aria">
    <div class="video-wrap">
      <video id="video" playsinline muted></video>
      <canvas id="sampleOverlay" class="sample-overlay"></canvas>
      <div id="cameraPlaceholder" class="camera-placeholder">
        <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true"><path fill="currentColor" d="M4 7h3l1.5-2h7L17 7h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1zm8 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></svg>
        <p data-i18n="camera.pressStart"></p>
      </div>
    </div>
    <div class="camera-controls">
      <button id="startBtn" class="btn btn-primary" type="button" data-i18n="camera.start"></button>
      <button id="stopBtn" class="btn" type="button" disabled data-i18n="camera.stop"></button>
      <button id="switchBtn" class="btn" type="button" disabled data-i18n="camera.switch"></button>
    </div>
  </section>
</div>

<div id="panelMonitoring" role="region" hidden data-i18n-attr="aria-label:nav.monitoring">

  <section class="card reading-card" data-i18n-attr="aria-label:reading.aria">
    <div class="reading-grid">

      <div class="reading-block">
        <h3 class="reading-title" data-i18n="metric.raw.name"></h3>
        <div class="gauge-wrap">
          <svg id="gaugeRaw" viewBox="0 0 200 130" class="gauge">
            <path class="gauge-band gauge-good" d="" />
            <path class="gauge-band gauge-warning" d="" />
            <path class="gauge-band gauge-critical" d="" />
            <line class="gauge-needle" x1="100" y1="95" x2="100" y2="32" />
            <circle cx="100" cy="95" r="6" class="gauge-hub" />
          </svg>
          <div class="gauge-readout">
            <div id="gaugeValueRaw" class="gauge-value">--</div>
            <div class="gauge-unit" data-i18n="metric.raw.unitLabel"></div>
            <div id="statusBadgeRaw" class="status-badge status-idle">
              <svg class="status-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"></svg>
              <span class="status-label"></span>
            </div>
          </div>
        </div>
      </div>

      <div class="reading-block">
        <h3 class="reading-title" data-i18n="metric.share.name"></h3>
        <div class="gauge-wrap">
          <svg id="gaugeShare" viewBox="0 0 200 130" class="gauge">
            <path class="gauge-band gauge-good" d="" />
            <path class="gauge-band gauge-warning" d="" />
            <path class="gauge-band gauge-critical" d="" />
            <line class="gauge-needle" x1="100" y1="95" x2="100" y2="32" />
            <circle cx="100" cy="95" r="6" class="gauge-hub" />
          </svg>
          <div class="gauge-readout">
            <div id="gaugeValueShare" class="gauge-value">--</div>
            <div class="gauge-unit" data-i18n="metric.share.unitLabel"></div>
            <div id="statusBadgeShare" class="status-badge status-idle">
              <svg class="status-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"></svg>
              <span class="status-label"></span>
            </div>
          </div>
        </div>
      </div>

    </div>
    <div class="secondary-stats">
      <div class="stat"><span class="stat-label" data-i18n="stat.overallBrightness"></span><span id="overallBrightness" class="stat-value">--%</span></div>
    </div>
    <!-- Zdanie i odnośnik to dwa osobne klucze: odnośnik jest tu wyrazem
         w zdaniu, a nie zdaniem, więc tłumacz musi móc go odmienić osobno. -->
    <p id="medicalDisclaimerShort" class="ui-disclaimer-short"><span data-i18n="disclaimer.short"></span> <a id="medicalDisclaimerLink" href="#" data-i18n="disclaimer.more"></a></p>
  </section>

  <section class="card chart-card" data-i18n-attr="aria-label:chart.aria">
    <div class="chart-header">
      <!-- Napis zawiera długość okna wykresu, a ta jest stałą z app.js
           (WINDOW_MS) — dlatego wstawia go app.js, a nie przebieg statyczny. -->
      <h2 id="chartsTitle"></h2>
      <button id="tableToggle" class="btn btn-small" type="button" aria-pressed="false" data-i18n="table.show"></button>
      <!-- Bez onclick w znaczniku: obsługę wpina features.js (oznacza przycisk
           atrybutem data-wired). Eksport działa dla każdego, bez warunków. -->
      <button id="exportCsvBtn" class="btn" type="button" data-i18n="action.exportCsv"></button>
    </div>

    <div class="chart-block">
      <h3 class="chart-title" data-i18n="metric.raw.name"></h3>
      <canvas id="chartRaw" class="chart-canvas" role="img" data-i18n-attr="aria-label:chart.raw.aria"></canvas>
    </div>

    <div class="chart-block">
      <h3 class="chart-title" data-i18n="metric.share.longName"></h3>
      <canvas id="chartShare" class="chart-canvas" role="img" data-i18n-attr="aria-label:chart.share.aria"></canvas>
    </div>

    <div class="legend" aria-hidden="false">
      <div class="legend-item">
        <span class="legend-swatch legend-good"></span>
        <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
        <span data-i18n="zone.good"></span>
      </div>
      <div class="legend-item">
        <span class="legend-swatch legend-warning"></span>
        <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
        <span data-i18n="zone.warning"></span>
      </div>
      <div class="legend-item">
        <span class="legend-swatch legend-critical"></span>
        <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2 1 12l11 10 11-10L12 2zm-1 5h2v6h-2V7zm0 8h2v2h-2v-2z"/></svg>
        <span data-i18n="zone.critical"></span>
      </div>
    </div>

    <!-- Wypełniane przez features.js: przeglądarka historii długoterminowej
         wraz z raportem dziennym i tygodniowym. -->
    <div id="historyPanel"></div>

    <div id="tableWrap" class="table-wrap" hidden>
      <table class="readings-table">
        <caption data-i18n="table.caption"></caption>
        <thead><tr>
          <th scope="col" data-i18n="table.col.time"></th>
          <th scope="col" data-i18n="metric.raw.name"></th>
          <th scope="col" data-i18n="metric.share.name"></th>
          <th scope="col" data-i18n="table.col.zone"></th>
        </tr></thead>
        <tbody id="readingsBody"></tbody>
      </table>
    </div>
  </section>

  <details class="card settings-card" id="settingsCard">
    <summary data-i18n="settings.title"></summary>
    <div class="settings-body">
      <div class="settings-group">
        <h4 class="settings-group-title" data-i18n="metric.raw.name"></h4>
        <!-- Etykieta i wartość są osobnymi elementami: wartość wpisuje
             syncThresholdUi() przy każdym ruchu suwaka, a etykieta jest
             napisem i należy do warstwy językowej. -->
        <label class="slider-row">
          <span><span data-i18n="settings.boundary.critical"></span> <b id="rawCritLabel">66%</b></span>
          <input id="rawCritSlider" type="range" min="10" max="95" value="66">
        </label>
        <label class="slider-row">
          <span><span data-i18n="settings.boundary.warning"></span> <b id="rawWarnLabel">33%</b></span>
          <input id="rawWarnSlider" type="range" min="5" max="90" value="33">
        </label>
      </div>

      <div class="settings-group">
        <h4 class="settings-group-title" data-i18n="metric.share.name"></h4>
        <label class="slider-row">
          <span><span data-i18n="settings.boundary.critical"></span> <b id="shareCritLabel">33%</b></span>
          <input id="shareCritSlider" type="range" min="10" max="95" value="33">
        </label>
        <label class="slider-row">
          <span><span data-i18n="settings.boundary.warning"></span> <b id="shareWarnLabel">26%</b></span>
          <input id="shareWarnSlider" type="range" min="5" max="90" value="26">
        </label>
      </div>

      <!-- Wypełniane przez features.js: zarządzanie profilami progów. -->
      <div id="profilesPanel"></div>
    </div>
  </details>

</div>

<div id="panelMethodology" role="region" class="methodology" hidden data-i18n-attr="aria-label:doc.aria">

  <!-- data-nav-back to delegowana obsługa powrotu z menu.js — bez wpinania
       osobnego uchwytu na każdym ekranie. -->
  <div class="ui-row">
    <button type="button" class="ui-back-btn" data-nav-back data-i18n="action.back" data-i18n-attr="aria-label:action.back.aria"></button>
  </div>

  <section class="card ui-disclaimer" role="note">
    <h3 data-i18n="disclaimer.title"></h3>
    <p data-i18n="disclaimer.body.docs"></p>
  </section>

  <nav class="doc-toc card" data-i18n-attr="aria-label:doc.toc.aria">
    <h2 data-i18n="doc.toc.title"></h2>
    <ol>
      <li><a href="#doc-start" data-i18n="doc.ch1.title"></a></li>
      <li><a href="#doc-metodologia" data-i18n="doc.ch2.title"></a></li>
      <li><a href="#doc-jednostki" data-i18n="doc.ch3.title"></a></li>
      <li><a href="#doc-strefy" data-i18n="doc.ch4.title"></a></li>
      <li><a href="#doc-urzadzenia" data-i18n="doc.ch5.title"></a></li>
    </ol>
  </nav>

  <h2 id="doc-start" class="doc-chapter" data-i18n="doc.ch1.heading"></h2>

  <section class="card">
    <h3 data-i18n="doc.ch1.tips.title"></h3>
    <ul>
      <li data-i18n="doc.ch1.tips.li1"></li>
      <li data-i18n="doc.ch1.tips.li2"></li>
      <li data-i18n="doc.ch1.tips.li3"></li>
      <li data-i18n="doc.ch1.tips.li4"></li>
      <li data-i18n="doc.ch1.tips.li5"></li>
      <li data-i18n="doc.ch1.tips.li6"></li>
    </ul>
  </section>

  <section class="card">
    <h3 data-i18n="doc.ch1.fonts.title"></h3>
    <p data-i18n="doc.ch1.fonts.p1"></p>
  </section>

  <h2 id="doc-metodologia" class="doc-chapter" data-i18n="doc.ch2.heading"></h2>

  <!-- Akapity Dokumentacji idą przez data-i18n-html: autor tekstu świadomie
       wyróżnił w nich pojedyncze wyrazy <b> i wzory <code>, a rozbicie tego na
       klucz na wyraz uniemożliwiłoby jakiekolwiek tłumaczenie. -->
  <section class="card">
    <h3 data-i18n="doc.ch2.spectro.title"></h3>
    <p data-i18n-html="doc.ch2.spectro.p1.html"></p>
    <p data-i18n-html="doc.ch2.spectro.p2.html"></p>
  </section>

  <section class="card">
    <h3 data-i18n="doc.ch2.raw.title"></h3>
    <p data-i18n-html="doc.ch2.raw.what.html"></p>
    <p data-i18n-html="doc.ch2.raw.algo.html"></p>
    <ol>
      <li data-i18n="doc.ch2.raw.step1"></li>
      <li data-i18n="doc.ch2.raw.step2"></li>
      <li data-i18n="doc.ch2.raw.step3"></li>
      <li data-i18n="doc.ch2.raw.step4"></li>
      <li data-i18n-html="doc.ch2.raw.step5.html"></li>
    </ol>
    <p data-i18n-html="doc.ch2.raw.why.html"></p>
  </section>

  <section class="card">
    <h3 data-i18n="doc.ch2.share.title"></h3>
    <p data-i18n-html="doc.ch2.share.what.html"></p>
    <p data-i18n-html="doc.ch2.share.algo.html"></p>
    <p class="formula-block" data-i18n-html="doc.ch2.share.formula.html"></p>
    <p data-i18n-html="doc.ch2.share.neutral.html"></p>
    <p data-i18n-html="doc.ch2.share.why.html"></p>
  </section>

  <h2 id="doc-jednostki" class="doc-chapter" data-i18n="doc.ch3.heading"></h2>

  <section class="card">
    <h3 data-i18n="doc.ch3.units.title"></h3>
    <p data-i18n-html="doc.ch3.units.p1.html"></p>
    <p data-i18n-html="doc.ch3.units.p2.html"></p>
  </section>

  <section class="card">
    <h3 data-i18n="doc.ch3.norms.title"></h3>
    <p data-i18n-html="doc.ch3.norms.p1.html"></p>
    <p data-i18n-html="doc.ch3.norms.p2.html"></p>
    <p data-i18n-html="doc.ch3.norms.p3.html"></p>
    <p data-i18n-html="doc.ch3.norms.p4.html"></p>
    <p data-i18n-html="doc.ch3.norms.p5.html"></p>
  </section>

  <h2 id="doc-strefy" class="doc-chapter" data-i18n="doc.ch4.heading"></h2>

  <section class="card">
    <h3 data-i18n="doc.ch4.zones.title"></h3>
    <p data-i18n-html="doc.ch4.zones.p1.html"></p>
    <ul>
      <li data-i18n-html="doc.ch4.zones.li1.html"></li>
      <li data-i18n-html="doc.ch4.zones.li2.html"></li>
      <li data-i18n-html="doc.ch4.zones.li3.html"></li>
    </ul>

    <p data-i18n-html="doc.ch4.zones.p2.html"></p>
    <p data-i18n-html="doc.ch4.zones.p3.html"></p>
    <ul>
      <li data-i18n-html="doc.ch4.zones.li4.html"></li>
      <li data-i18n-html="doc.ch4.zones.li5.html"></li>
    </ul>
    <p data-i18n-html="doc.ch4.zones.p4.html"></p>
    <p data-i18n-html="doc.ch4.zones.p5.html"></p>
  </section>

  <h2 id="doc-urzadzenia" class="doc-chapter" data-i18n="doc.ch5.heading"></h2>

  <section class="card">
    <h3 data-i18n="doc.ch5.devices.title"></h3>
    <p data-i18n-html="doc.ch5.devices.p1.html"></p>
    <p data-i18n-html="doc.ch5.devices.p2.html"></p>
    <p data-i18n-html="doc.ch5.devices.p3.html"></p>
  </section>

</div>

<!-- Ekrany nakładkowe. Celowo zwykłe <div>-y, NIE role="tabpanel" — stoją poza
     listą zakładek, dokładnie tak jak #panelMethodology. Treść wstrzykują
     support.js (wsparcie) i menu.js (więcej, o aplikacji). -->
<div id="panelSupport" class="ui-screen" role="region" aria-labelledby="supportTitle" hidden></div>
<div id="panelMore" class="ui-screen" role="region" aria-labelledby="moreTitle" hidden></div>
<div id="panelAbout" class="ui-screen" role="region" aria-labelledby="aboutTitle" hidden></div>
</main>

<!-- Warstwy globalne, wszystkie wypełniane w trakcie działania. -->
<nav id="appNav" class="nav-bar" data-i18n-attr="aria-label:nav.aria"></nav>
<div id="navLive" class="ui-visually-hidden" aria-live="polite"></div>
<div id="uiToastRegion" class="ui-toast-region" role="status" aria-live="polite"></div>

<!-- Kolejność wczytywania to twarda umowa: features, menu i support definiują
     powierzchnie, a app.js jako ostatni publikuje AppTabs/AppData i zgłasza
     'app:ready', które uruchamia całą trójkę. Bez defer/async, bez modułów. -->
<script src="features.js"></script>
<script src="menu.js"></script>
<script src="support.js"></script>
<script src="app.js"></script>
</body>
</html>
